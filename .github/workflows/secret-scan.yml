name: Secret Scan

# This repo is the live config for a box: a committed credential is an
# immediate compromise. On a free-plan private repo GitHub's push protection
# is not available, and most commits to main are direct operator pushes, so
# the scan runs on every push to main as well as on every PR, weekly, and on
# demand. It takes seconds, so the per-push cost is negligible.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Renovate rebases its PRs freely and each rebase re-runs the scan; only the
# newest head matters, so superseded PR runs stop early.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Scan history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact -v
