name: Secret Scan

# This repo is the live config for a box: a committed credential is an
# immediate compromise. GitHub push protection is the push-time gate; this
# scans the full history on every PR, weekly, and on demand as defence in
# depth (per-push full-history rescans just re-billed identical results).
on:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact -v
