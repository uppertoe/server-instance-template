name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  template-consistency:
    name: Template Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # The consistency check re-renders the committed .generated/caddy bundle
      # via the scaffold's renderer, so the submodule is needed here too.
      - name: Sync scaffold submodule
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Run template consistency checks
        run: bash scripts/check-template-consistency.sh

  image-pins:
    name: Image Digest Pins
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Sync scaffold submodule
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule sync --recursive
          git submodule update --init --recursive

      # Supply-chain gate: every compose image (apps + scaffold caddy base)
      # must be pinned by digest. Renovate's pinDigests keeps pins current.
      - name: Verify all images are pinned by digest
        run: bash scripts/check-image-pins.sh

  compose-smoke:
    name: Compose Smoke
    runs-on: ubuntu-latest
    needs: template-consistency
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Sync scaffold submodule
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule sync --recursive
          git submodule update --init --recursive

      # The per-app proxy-network wiring relies on Compose include-merge of
      # partial service stanzas, which the runner's bundled compose predates
      # ("services.caddy conflicts with imported resource"). Install the same
      # docker-compose-plugin production hosts get from Docker's apt repo
      # (the scaffold docker role), so CI tests what production runs.
      - name: Install current docker-compose-plugin (match production)
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
            | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q docker-compose-plugin
          docker compose version

      - name: Run compose smoke test
        run: bash scripts/ci-compose-smoke-test.sh

  container-security:
    name: App image and compose scan
    runs-on: ubuntu-latest
    needs: template-consistency
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Prepare reports directory
        run: mkdir -p reports/container-security

      # Image CVE scan of every app image — report-only so an unfixable upstream
      # CVE does not block deploys. Findings surface in the artifact and summary.
      - name: Trivy image scan (app images)
        run: |
          images="$(grep -rhoE 'image:\s*\S+' apps/*/docker-compose.yml | awk '{print $2}' | sort -u)"
          for img in $images; do
            safe="$(echo "$img" | tr '/:@' '___')"
            docker run --rm -v "$PWD/reports/container-security:/out" aquasec/trivy:latest@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f image \
              --severity HIGH,CRITICAL --no-progress --format table \
              --output "/out/trivy-${safe}.txt" "$img" || true
            echo "### Trivy ${img}" >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 "reports/container-security/trivy-${safe}.txt" >> "$GITHUB_STEP_SUMMARY" || true
          done

      # Static compose misconfig lint of every app. Fails on HIGH. Excluded query
      # IDs are the accepted public-reverse-proxy exceptions documented in
      # scaffold/docs/08-security-model.md.
      - name: KICS compose scan (apps)
        run: |
          docker run --rm -v "$PWD/apps:/path" -v "$PWD/reports/container-security:/out" \
            checkmarx/kics:latest@sha256:3e5a268eb8adda2e5a483c9359ddfc4cd520ab856a7076dc0b1d8784a37e2602 scan -p /path --type DockerCompose \
            --exclude-queries 8c978947-0ff6-485c-b0c2-0bfca6026466,bc2908f3-f73c-40a9-8793-c1b7d5544f79,451d79dc-0588-476a-ad03-3c7f0320abb3,ce76b7d0-9e77-464d-b86f-c5c48e03e22d \
            --report-formats json --output-name kics-apps -o /out --fail-on high

      - name: Upload container security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-security-reports
          path: reports/container-security

  forward-auth-security:
    name: Forward-Auth Security
    runs-on: ubuntu-latest
    needs: template-consistency
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Guards the auth lynchpin: the (protected) snippet in apps/auth/auth.caddy
      # must strip client-supplied Remote-* headers, redirect unauthenticated
      # requests, and scope protection by path. Uses a mock auth, so no submodule
      # or OTP login is needed.
      - name: Verify forward_auth header-stripping and path scoping
        run: bash scripts/ci-forward-auth-test.sh
