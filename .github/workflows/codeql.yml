name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 21 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    # CodeQL code scanning needs GitHub Advanced Security on private repos.
    # Deployments created from this template are private (and typically on the
    # free plan without GHAS), where this job cannot run and fails on every
    # push/PR. Gate it to the public template repo so it scans here and is
    # skipped (neutral, not failed) in every private fork — no per-repo cleanup.
    if: github.repository == 'uppertoe/server-instance-template'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
