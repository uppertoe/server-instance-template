name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 21 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    # CodeQL code scanning needs GitHub Advanced Security on private repos.
    # Deployments created from this template are private (and typically on the
    # free plan without GHAS), where this job cannot run and fails on every
    # push/PR. Gate it to the public template repo so it scans here and is
    # skipped (neutral, not failed) in every private fork — no per-repo cleanup.
    if: github.repository == 'uppertoe/server-instance-template'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@08d09a53f0f5d694f253bd25732e4429c9e9337f # v3
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@08d09a53f0f5d694f253bd25732e4429c9e9337f # v3
