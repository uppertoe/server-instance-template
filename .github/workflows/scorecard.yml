name: OpenSSF Scorecard

# Supply-chain hygiene scoring of THIS repository (branch protection, pinned
# dependencies, workflow permissions, ...). Results publish to the OpenSSF
# API (public badge) and to the repo's code-scanning tab.

on:
  schedule:
    - cron: "23 20 * * 0"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # Scorecard uploads SARIF to the code-scanning tab, which needs GitHub
    # Advanced Security on private repos. Deployments created from this
    # template are private free-plan repos where that upload fails on every
    # push — billing minutes to produce a red X. Gate it to the public
    # template repo, mirroring the CodeQL gate: it scans here and is skipped
    # (neutral, not failed) in every private fork — no per-repo cleanup.
    if: github.repository == 'uppertoe/server-instance-template'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          sarif_file: results.sarif
