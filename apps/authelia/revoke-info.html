<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Password reset</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#f4f5f7; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { background:#fff; padding:2rem 2.25rem; border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,.08); width:100%; max-width:380px; }
  h1 { font-size:1.2rem; margin:0 0 .5rem; color:#111827; }
  p { color:#4b5563; line-height:1.45; font-size:.92rem; margin:0 0 .9rem; }
  a { color:#2563eb; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <h1>Password reset</h1>
    <p>If you didn't request a password reset, no action is needed — the reset link expires on its own shortly.</p>
    <p>If you did, go back to the email, open the reset link, and enter your email address when prompted.</p>
    <p><a href="/">Back to sign in</a></p>
  </div>
</body>
</html>
