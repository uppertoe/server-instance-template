services:
  auth:
    # Pinned by digest (supply-chain control; CI's image-pins job enforces it).
    # Renovate's pinDigests keeps the digest current via PR. The image is distroless
    # and already runs as the nonroot user (65532). See scaffold/docs/08-security-model.md.
    image: ghcr.io/uppertoe/vps-scaffold-auth:latest@sha256:afedce7ef29ce18d3c61756c871ae4af405b6eb0a648acb049cb325644d15b57
    restart: unless-stopped
    # CIS Docker §5 runtime hardening. The auth binary needs no extra capabilities
    # and binds only an internal port behind Caddy.
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ./.env
        required: false # keep `docker compose config` valid in CI without a real .env
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - auth_data:/data
    networks:
      - caddy
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  auth_data:

# Must be byte-identical to the stanza in scaffold/docker/caddy.base.yml:
# Compose v5 include-merge rejects conflicting definitions of the same network.
networks:
  caddy:
    name: caddy  # fixed name so app containers can join it
