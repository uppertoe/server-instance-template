services:
  auth:
    # Pinned by digest (supply-chain control; CI's image-pins job enforces it;
    # the weekly digest-freshness workflow flags drift). The image is distroless
    # and already runs as the nonroot user (65532). See scaffold/docs/08-security-model.md.
    image: ghcr.io/uppertoe/vps-scaffold-auth:latest@sha256:6ece047bb7b707c0f4eb57ddfc4037e4578ff1c88f04e34222d9dd8379e541b5
    restart: unless-stopped
    # CIS Docker §5 runtime hardening. The auth binary needs no extra capabilities
    # and binds only an internal port behind Caddy.
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ./.env
        required: false # keep `docker compose config` valid in CI without a real .env
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - auth_data:/data
    # Proxy-network wiring is generated (.generated/caddy/networks.yml): auth
    # joins only its own auth_proxy network, which Caddy also joins.
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  auth_data:
