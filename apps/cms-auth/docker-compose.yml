# cms-auth: gateway-gated commit broker for the Git-based CMS (Decap) on the
# Hugo sites. Editors sign in through the estate gateway (apps/auth) -- no
# GitHub account each -- and the broker commits through ONE shared GitHub App,
# stamping each commit's author with the signed-in editor. The App private key
# is minted into installation tokens SERVER-SIDE and never reaches the browser.
#
# Public host cms-auth.<DOMAIN>. Only /auth sits behind the gateway (members of
# cms-editors); the CMS calls the /api commit proxy cross-origin without the
# gateway cookie, so /api is authenticated by the signed session token that
# /auth issues. The broker trusts the gateway's Remote-* headers only alongside
# X-Gateway-Secret, which Caddy injects (cms-auth.caddy). Publishes no ports;
# Caddy reaches it over the generated cms-auth_proxy network. ONE broker serves
# every CMS site in the estate -- each site points its Decap config at this
# host and is added to ALLOWED_ORIGINS / ALLOWED_REPOS.
services:
  cms-auth:
    # Multi-arch index digest of ghcr.io/uppertoe/cms-auth:latest (Renovate keeps
    # it current thereafter). Re-pin with:
    #   docker buildx imagetools inspect ghcr.io/uppertoe/cms-auth:latest
    image: ghcr.io/uppertoe/cms-auth:latest@sha256:02ce419b7ae297f4dc526249597a2a0003cf2e6458c388067a62617b175d09dc
    restart: unless-stopped
    env_file:
      # Deployment-specific values + secrets: ALLOWED_ORIGINS, ALLOWED_REPOS,
      # GITHUB_APP_ID/INSTALLATION_ID, COMMITTER_*, and the three secrets
      # (GITHUB_APP_PRIVATE_KEY_B64, SESSION_SECRET).
      - path: ./.env
        required: false # keep `docker compose config` valid in CI without a real .env
    environment:
      # Non-secret, DOMAIN-derived — identical across the fleet.
      - BASE_URL=https://cms-auth.${DOMAIN}
      # Gateway mode: /auth reads the gateway's identity headers, trusted only
      # alongside this secret (root .env, also given to Caddy below).
      - AUTH_MODE=gateway
      - GATEWAY_SECRET=${CMS_AUTH_GATEWAY_SECRET:-}
      # Only members of this gateway group may obtain an editing session. The
      # gate in cms-auth.caddy ALSO requires it, so this is defence in depth;
      # keep the two in sync.
      - EDITOR_GROUP=cms-editors
      # Editing-session lifetime. Kept short: the session token is what a stolen
      # editor browser would carry, and it has no revocation short of rotating
      # SESSION_SECRET. 4h covers a work session; re-login is a fast gateway
      # bounce while the gateway session lasts.
      - SESSION_TTL=4h
    # --- CIS Docker §5 ---
    user: "65532:65532"        # distroless nonroot; the broker writes nothing
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    # cgroup_parent, not memswap_limit: Docker records memswap_limit and the
    # systemd cgroup driver does not apply it, so the container swaps anyway.
    # The slice (scaffold docker role) sets memory.swap.max=0 and cgroup v2
    # enforces the smallest limit along the path. Safe here because measured
    # usage is far under mem_limit - a container that cannot swap is
    # OOM-killed rather than borrowing.
    cgroup_parent: vps-noswap.slice
    mem_limit: 96m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s   # generous on purpose: only startup failures inside this window are forgiven, and a full-stack recreate on the 2 GB box starves every app of CPU for minutes
    # NOTE: no published ports — only Caddy may reach the service.

  # Give Caddy the gateway secret that cms-auth.caddy injects as
  # X-Gateway-Secret (compose merges this into the base caddy service).
  caddy:
    environment:
      - CMS_AUTH_GATEWAY_SECRET=${CMS_AUTH_GATEWAY_SECRET:-}
